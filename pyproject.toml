[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nba_longevity"
version = "0.0.1"
description = "AT1 - Predicting sustained NBA careers from college statistics"
authors = [
  { name = "Asif" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipython",
    "joblib==1.4.2",
    "jupyterlab==4.6.1",
    "loguru",
    "matplotlib==3.9.2",
    "notebook",
    "numpy",
    "pandas==2.2.2",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn==1.6.1",
    "seaborn==0.13.2",
    "tqdm",
    "typer",
]
requires-python = "==3.12.13"


[tool.ruff]
line-length = 99
src = ["nba_longevity"]
include = ["pyproject.toml", "nba_longevity/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["nba_longevity"]
force-sort-within-sections = true

